<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enregistrement | Kagami Ren</title><link rel="stylesheet" href="style.css"></head><body><main><a class="back" href="index.html">← RETOUR AUX ARCHIVES</a><header><small>● REC // TRANSCRIPTION VIDÉO</small><h1 id="title"></h1><p id="meta"></p></header><article class="screen"><div class="bar">● ENREGISTREMENT LOCAL <span>VESPER // PRIVÉ</span></div><div id="transcript"></div><footer>■ FIN DE L'ENREGISTREMENT</footer></article><p><a class="back" href="index.html">← RETOUR AUX ARCHIVES</a></p></main><script src="journal.js"></script><script>const e=entries.find(x=>x.id===new URLSearchParams(location.search).get('id'));if(e){document.title=e.title+' | Kagami Ren';document.getElementById('title').textContent=e.title;document.getElementById('meta').textContent=e.date+' // '+e.location;const t=document.getElementById('transcript');e.lines.forEach(l=>{const p=document.createElement('p');p.className=l.type==='stage'?'stage':'speech';p.textContent=l.type==='stage'?'['+l.text+']':'« '+l.text+' »';t.append(p)})}else{document.getElementById('title').textContent='ARCHIVE INTROUVABLE'}</script></body></html>
