<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VESPER // Enregistrement</title><link rel="stylesheet" href="style.css"></head><body><div class="shell"><aside class="side"><div class="mark">V<span>/</span></div><div class="vertical">個人記録 // ARCHIVE PRIVÉE</div><div class="side-foot">K2 / 2075</div></aside><main><nav class="top"><span>VESPER <i>//</i> LECTURE D'ARCHIVE</span><span class="status"><b></b> LIAISON ISOLÉE</span></nav><a class="back" href="index.html">← RETOUR AUX ARCHIVES</a><header class="record-head"><div class="eyebrow">OFF-GRID VIDEO LOG <span>非公開記録</span></div><h1 id="title"></h1><p id="meta"></p></header><article class="screen"><div class="bar"><span class="rec"><b></b> REC <span class="muted">/ TRANSCRIPTION // LOCAL ONLY</span></span><span id="file-id">VESPER</span></div><div class="viewfinder"><span class="corner tl"></span><span class="corner tr"></span><div id="transcript"></div><span class="corner bl"></span><span class="corner br"></span></div><div class="end">■ FIN DE L'ENREGISTREMENT <span>録画終了</span></div></article><footer>VESPER // NO EXTERNAL UPLINK <span>終わりではない</span></footer></main></div><script src="journal.js"></script><script>const e=entries.find(x=>x.id===new URLSearchParams(location.search).get('id'));if(e){document.title=e.title+' // VESPER';document.getElementById('title').textContent=e.title;document.getElementById('meta').textContent=e.date+' // '+e.location;document.getElementById('file-id').textContent=e.id;const t=document.getElementById('transcript');let speech=[];const flush=()=>{if(!speech.length)return;const p=document.createElement('p');p.className='speech';p.textContent=speech.join(' ');t.append(p);speech=[]};e.lines.forEach(l=>{if(l.type==='stage'){flush();const p=document.createElement('p');p.className='stage';p.textContent='['+l.text+']';t.append(p)}else{speech.push(l.text)}});flush()}else{document.getElementById('title').textCon
