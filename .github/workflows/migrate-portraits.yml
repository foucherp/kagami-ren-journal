name: Migrer les portraits vers Supabase Storage
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: migration-portraits-supabase
  cancel-in-progress: false
jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Importer les portraits sans supprimer les originaux
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/migrate-portraits.mjs
