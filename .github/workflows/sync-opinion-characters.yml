name: Synchroniser les personnages vers Supabase

on:
  push:
    branches: [main]
    paths:
      - index-personnages.json
      - scripts/sync-opinion-characters.mjs
      - .github/workflows/sync-opinion-characters.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-opinion-characters
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lire le répertoire
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchroniser les identifiants autorisés
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-opinion-characters.mjs
