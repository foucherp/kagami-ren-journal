<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archives de Kagami Ren</title><link rel="stylesheet" href="style.css"></head><body><main><header><small>◉ ARCHIVES PERSONNELLES // VESPER</small><h1>KAGAMI REN</h1><p>Journal vidéo · Transcriptions</p></header><h2>ENREGISTREMENTS</h2><div id="list"></div><footer>■ ARCHIVES CHIFFRÉES (FICTION)</footer></main><script src="journal.js"></script><script>const list=document.getElementById('list');entries.forEach(e=>{const a=document.createElement('a');a.className='entry';a.href='archive.html?id='+encodeURIComponent(e.id);const meta=document.createElement('small');meta.textContent=e.date+' // '+e.id;const title=document.createElement('strong');title.textContent=e.title;const desc=document.createElement('span');desc.textContent=e.summary;a.append(meta,title,desc);list.append(a)});</script></body></html>
