<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Runner // Terminal</title><style>
:root{color-scheme:dark;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#080a0f;color:#e9e6ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,#28212e 0%,#12131b 43%,#080a0f 82%)}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#ffffff06 4px 5px)}.shell{width:min(780px,calc(100% - 40px));padding:60px 0;position:relative}.frame{border:1px solid #5c3c4b;padding:clamp(24px,5vw,55px);background:#111116d9;box-shadow:0 25px 100px #0009;position:relative}.frame:before,.frame:after{content:"";position:absolute;width:20px;height:20px;border-color:#d76e80}.frame:before{top:-1px;left:-1px;border-top:2px solid;border-left:2px solid}.frame:after{bottom:-1px;right:-1px;border-bottom:2px solid;border-right:2px solid}.eyebrow{color:#cf7885;font-size:11px;letter-spacing:.24em}.head{font-family:Georgia,serif;font-size:clamp(25px,5.3vw,48px);font-weight:400;letter-spacing:-.045em;white-space:nowrap;margin:14px 0 0}.head span{color:#d05c6d}.sub{color:#aca3ad;font-size:13px;line-height:1.8;margin:0 0 34px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.choice{background:#19151c;color:#f0e9ef;border:1px solid #654551;padding:24px;text-align:left;cursor:pointer;min-height:130px;transition:border-color .2s,background .2s,transform .2s}.choice:hover,.choice:focus-visible{border-color:#d46e7c;background:#30212b;transform:translateY(-2px)}.choice strong{display:block;font:16px ui-monospace,monospace;letter-spacing:.12em;margin-bottom:13px}.choice small{font:11px ui-monospace,monospace;color:#b9a4b0}.foot{display:flex;justify-content:space-between;gap:12px;margin-top:26px;color:#78707d;font-size:10px;letter-spacing:.1em}.grant-screen{display:grid;position:fixed;inset:0;background:#070b0b;z-index:5;place-items:center;text-align:center;padding:25px}.grant-screen.done{display:none}.grant-title{font-size:clamp(31px,7vw,64px);letter-spacing:.14em;color:#a0e8b9;text-shadow:0 0 35px #59ca9360;animation:appear .2s ease-out}.grant-sub{color:#a5b5ac;font-size:11px;letter-spacing:.2em;margin-top:20px}.progress{width:min(310px,70vw);height:2px;background:#25382d;margin:26px auto}.progress:before{content:"";display:block;height:100%;background:#a0e8b9;animation:fill .75s linear forwards}@keyframes appear{from{opacity:0;filter:blur(5px)}to{opacity:1;filter:blur(0)}}@keyframes fill{from{width:0}to{width:100%}}@media(max-width:520px){.choices{grid-template-columns:1fr}.choice{min-height:105px}}@media(prefers-reduced-motion:reduce){*,*:before{animation-duration:.01ms!important}}
</style></head><body><main class="shell"><div class="frame"><div class="eyebrow">SECURE SHADOW NETWORK // K2 PROTOCOL</div><h1 class="head">BIENVENUE RUNNER<span>.</span></h1><p class="sub">// Accès aux archives et aux répertoires de l'équipe.<br>Sélectionnez votre destination.</p><div class="choices"><button class="choice" data-dest="vlog.html"><strong>01 // VLOG DE VESPER</strong><small>ARCHIVES PERSONNELLES / JOURNAL</small></button><button class="choice" data-dest="repertoire.html"><strong>02 // RÉPERTOIRES</strong><small>ÉQUIPE / COMMUN / CONTACTS</small></button></div><div class="foot"><span>ACCESS TERMINAL // ONLINE</span><span>SEATTLE / 2075</span></div></div></main><div id="grant" class="grant-screen" role="status" aria-live="polite"><div><div class="eyebrow">IDENTIFICATION VALIDÉE</div><div class="grant-title">ACCESS GRANTED</div><div class="grant-sub">CONNEXION AU TERMINAL RUNNER</div><div class="progress"></div></div></div><script>
document.querySelectorAll('[data-dest]').forEach(button=>button.addEventListener('click',()=>{location.href=button.dataset.dest}));
const grant=document.getElementById('grant');
const visited=sessionStorage.getItem('runner-access-granted')==='1';
if(visited){grant.classList.add('done')}else{sessionStorage.setItem('runner-access-granted','1');setTimeout(()=>grant.classList.add('done'),850)}
</script></body></html>
